name: Morgenbrief

on:
  schedule:
    # GitHub bruger UTC og kan forsinke eller springe kørsler over, især på hele
    # klokkeslæt. Derfor flere forsøg lidt skævt ift. hele timer. Scriptet sørger for,
    # at briefen kun postes én gang om dagen, og venter til kl. 07:00 hvis den er tidligt klar.
    # Sommertid: 06:40, 07:10, 07:40, 08:10 · Vintertid: 06:40 og 07:10 dansk tid
    - cron: "40 4 * * *"
    - cron: "10 5 * * *"
    - cron: "40 5 * * *"
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post nu, uanset klokkeslæt"
        type: boolean
        default: true

permissions:
  contents: write

# Kun én kørsel ad gangen, så to forsøg aldrig poster samtidig
concurrency:
  group: morgenbrief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # Altid nyeste version, så vi kan se om dagens brief allerede er postet

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer pakker
        run: pip install -r requirements.txt

      - name: Lav og post morgenbrief
        run: python morgenbrief.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}

      - name: Gem dagens brief (til at undgå gentagelser i morgen)
        run: |
          git config user.name "morgenbrief-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Morgenbrief $(date -u +%F)" && git push)
